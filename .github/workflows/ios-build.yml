name: build-bytelab-ios

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'project.yml'
      - 'bytelab/**'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen 2.38 (classic project format)
        run: |
          curl -sL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip"
          unzip -o xcodegen.zip -d xcodegen
          echo "$PWD/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          chmod +x "$PWD/xcodegen/xcodegen/bin/xcodegen"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild -project bytelab.xcodeproj -scheme bytelab \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=build \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          APP="build/Release-iphoneos/bytelab.app"
          echo "APP=$APP"
          cp -R "$APP" Payload/
          zip -r bytelab-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: bytelab-unsigned.ipa
          path: bytelab-unsigned.ipa
