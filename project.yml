name: bytelab
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"
  bundleIdPrefix: com.bytelab
targets:
  bytelab:
    type: application
    platform: iOS
    sources:
      - bytelab
    info:
      path: bytelab/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bytelab.app
        PRODUCT_NAME: bytelab
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: bytelab/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
